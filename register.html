<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Page</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css'>
  <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap'>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: url('kidney.jpg');">
<div class="wrapper">
  <div class="register_box">
    <h2>Register</h2>
    <div class="form-group fullname">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter your full name">
    </div>
    <div class="form-group email">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address">
    </div>
    <div class="form-group phone">
      <label for="phone">Phone Number (with country code)</label>
      <input type="tel" id="phone" placeholder="Enter your phone number">
      <select id="country-code">
        <option value="+1">+1 (USA)</option>
        <option value="+91">+91 (India)</option>
        <!-- Add more options for other country codes as needed -->
      </select>
    </div>
    <div class="form-group password">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password">
      <i id="pass-toggle-btn" class="fa-solid fa-eye"></i>
    </div>
    <div class="form-group date">
      <label for="date">Birth Date</label>
      <input type="date" id="date" placeholder="Select your date">
    </div>
    <div class="form-group gender">
      <label for="gender">Gender</label>
      <select id="gender">
        <option value="" selected disabled>Select your gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group submit-btn">
      <span><input type="submit" value="Submit"><a href="dashboard.html">Submit</a></span>
    </div>
  </div>
</div>
<script src="registration.js"></script>
</body>
</html>
